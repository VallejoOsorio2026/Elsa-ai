name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    # PostgreSQL efímero para los tests de migraciones y del repositorio de
    # permisos. Nunca se usa el Supabase real en CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elsa
          POSTGRES_PASSWORD: elsa
          POSTGRES_DB: elsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (reads .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        env:
          ELSA_TEST_DATABASE_URL: postgresql://elsa:elsa@127.0.0.1:5432/elsa_test
        run: uv run pytest

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: gitleaks escanea todos los commits, no solo HEAD.
          fetch-depth: 0

      - name: Run gitleaks over the full git history
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
