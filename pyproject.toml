[project]
name = "elsa"
version = "0.1.0"
description = "ELSA backend (FastAPI) - corporate maintenance assistant for PAPELSA Molino Barbosa"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "anyio>=4.4",
    "mypy>=1.11",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elsa"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query` en los valores por defecto es el idioma de FastAPI para
# declarar dependencias, no un valor mutable compartido entre llamadas.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "elsa.api.deps.RequireScope",
]

[tool.mypy]
mypy_path = "src"
files = ["src/elsa", "tests"]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# asyncpg no publica marcador `py.typed`; sus tipos se anotan en el adaptador.
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
